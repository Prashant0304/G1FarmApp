<div class="login-wrapper">
    <div class="login-card">

        <div class="login-header">

            <h2>Farmer Login</h2>
            <p>Enter registerd mobile number to receive an OTP</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="sendOtp()">

            <div class="form-group">
                <label for="phone">Mobile Number</label>
                <div class="input-group">
                    <span class="prefix">+91</span>
                    <input id="phone" type="tel" formControlName="phoneNumber" placeholder="Enter 10-digit number"
                        maxlength="10" />
                </div>
                <small class="error" *ngIf="phone?.invalid && phone?.touched">
                    Please enter a valid 10-digit mobile number.
                </small>
            </div>

            <button type="submit" class="btn-primary" [disabled]="isLoading()">
                <span *ngIf="!isLoading()">Send OTP</span>
                <span *ngIf="isLoading()">Sending...</span>
            </button>

        </form>

        <div class="auth-switch-card">
            <span>First time using G1Farm?</span>

            <button type="button" class="btn-secondary" routerLink="/auth/farmer-registration">
                Create New Account
            </button>



        </div>

        <div class="auth-switch-card">
            <button type="button" class="btn-secondary" routerLink="/auth/admin-login">
                Admin - Login
            </button>
        </div>

        <div class="auth-switch-card">
            <button type="button" class="btn-secondary" routerLink="/auth/investor-login">
                Investor - Login
            </button>
        </div>


    </div>


</div>
