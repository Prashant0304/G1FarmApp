<aside class="sidebar" [class.collapsed]="collapsed" [class.mobile-open]="mobileOpen">

    <!-- Brand -->
    <div class="sidebar-brand">
        <div class="brand-icon" *ngIf="!collapsed">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.93 0 3.5 1.57 3.5 3.5S13.93 12 12 12s-3.5-1.57-3.5-3.5S10.07 5 12 5zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"
                    fill="currentColor" />
            </svg>
        </div>
        <span class="brand-name" *ngIf="!collapsed">Farm Investor</span>
        <button class="sidebar-toggle" (click)="toggleCollapse.emit()"
            [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'">
            <svg width="18" height="18" viewBox="0 0 24 24">
                <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="currentColor">
                </path>
            </svg>
        </button>
    </div>

    <!-- Nav -->
    <nav class="sidebar-nav">
        <div class="nav-section-label" *ngIf="!collapsed">Main</div>

        <a class="nav-item" routerLink="/investor/overview" routerLinkActive="active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
                <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" fill="currentColor" />
            </svg>
            <span class="nav-label" *ngIf="!collapsed">Overview</span>
        </a>

        <a class="nav-item" routerLink="/investor/portfolio" routerLinkActive="active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
                <path
                    d="M20 6h-2.18c.07-.44.18-.88.18-1.35C18 2.08 15.86 0 13.5 0c-1.3 0-2.51.6-3.5 1.68C9.01.6 7.8 0 6.5 0 4.14 0 2 2.08 2 4.65c0 .47.11.91.18 1.35H0v14h24V6h-4zM13.5 2c.96 0 1.82.84 2 2.09L16 6h-4.98l.45-1.86C11.72 2.84 12.54 2 13.5 2zM4 4.65C4 3.19 5.07 2 6.5 2c.96 0 1.77.84 1.98 2.09L8.96 6H4.02C3.99 5.78 4 5.22 4 4.65zM2 18V8h20v10H2z"
                    fill="currentColor" />
            </svg>
            <span class="nav-label" *ngIf="!collapsed">My Portfolio</span>
        </a>

        <a class="nav-item" routerLink="/investor/projects" routerLinkActive="active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
                <path
                    d="M12 3L1 9l4 2.18V15h2v-2.82l2 1.09V17c0 1.1.9 2 2 2s2-.9 2-2v-3.73l4-2.18V15h2v-3.82L23 9 12 3z"
                    fill="currentColor" />
            </svg>
            <span class="nav-label" *ngIf="!collapsed">Projects</span>
        </a>

        <a class="nav-item" routerLink="/investor/payments" routerLinkActive="active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none">
                <path
                    d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"
                    fill="currentColor" />
            </svg>
            <span class="nav-label" *ngIf="!collapsed">Payments</span>
        </a>
    </nav>

    <!-- Profile + Logout -->
    <div class="sidebar-profile" *ngIf="!collapsed">
        <div class="profile-avatar">
            {{ investor?.name?.charAt(0) }}{{ investor?.name?.split(' ')[1]?.charAt(0) }}
        </div>
        <div class="profile-info">
            <span class="profile-name">{{ investor?.name }}</span>
            <span class="profile-role">Investor</span>
        </div>
        <button class="logout-btn" (click)="logout.emit()" title="Sign out">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path
                    d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"
                    fill="currentColor" />
            </svg>
        </button>
    </div>
    <div class="sidebar-profile collapsed-profile" *ngIf="collapsed">
        <div class="profile-avatar">
            {{ investor?.name?.charAt(0) }}{{ investor?.name?.split(' ')[1]?.charAt(0) }}
        </div>
    </div>

</aside>
